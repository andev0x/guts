[package]
name = "guts-view"
version = "1.0.8"
authors = ["andev0x"]
edition = "2024"
description = "A keyboard-first terminal data explorer for CSV, JSON, and Databases."
license = "MIT"
repository = "https://github.com/andev0x/guts"
readme = "README.md"
keywords = ["terminal", "database", "csv", "viewer", "explorer"]
categories = ["command-line-utilities", "database-tools"]

[[bin]]
name = "guts"
path = "src/main.rs"

[dependencies]
arboard = "3.4"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
crossterm = "0.27"
fuzzy-matcher = "0.3"
mongodb = { version = "2.8", default-features = false, features = ["sync"] }
mysql = { version = "26", default-features = false, features = ["rustls-tls"] }
once_cell = "1.19"
opener = "0.7"
postgres = "0.19"
ratatui = "0.26"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
